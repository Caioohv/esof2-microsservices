name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test-store-service:
    name: Tests (store-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/store-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/store-service/package-lock.json
      - run: npm ci
      - run: npm test
