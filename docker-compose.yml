services:
  consul:
    image: hashicorp/consul:1.18
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul-init:
    image: hashicorp/consul:1.18
    depends_on:
      consul:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./infra/consul/init.sh:/init.sh:ro
    command: sh /init.sh
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      POSTGRES_DB: olimpo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret}
      USER_SERVICE_URL: http://user-service:3002
      PORT: 3001
      CONSUL_HOST: consul
    depends_on:
      postgres:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully

  user-service:
    build: ./services/user-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/user_db
      PORT: 3002
      CONSUL_HOST: consul
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  store-service:
    build: ./services/store-service
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/store_db
      PORT: 3004
      CONSUL_HOST: consul
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  webapp:
    build: ./services/webapp
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_AUTH_API_BASE: ${AUTH_API_BASE:-http://localhost:3001}
      PORT: 3000
    depends_on:
      - auth-service

volumes:
  postgres_data:
