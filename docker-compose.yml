services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      POSTGRES_DB: olimpo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/olimpo
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/olimpo
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy

  store-service:
    build: ./services/store-service
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD:-secret}@postgres:5432/olimpo
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
