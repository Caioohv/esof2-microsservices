services:
  postgres:
    image: postgres:16-alpine
    container_name: esof2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: olimpo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/esof2-auth-service:${IMAGE_TAG:-latest}
    container_name: esof2_auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USER_SERVICE_URL: http://user-service:3002
      CORS_ORIGIN: ${WEB_ORIGIN:-https://olimposhowcase.com.br}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - caddy_net

  user-service:
    image: ghcr.io/${GHCR_OWNER}/esof2-user-service:${IMAGE_TAG:-latest}
    container_name: esof2_user
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD}@postgres:5432/user_db
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  store-service:
    image: ghcr.io/${GHCR_OWNER}/esof2-store-service:${IMAGE_TAG:-latest}
    container_name: esof2_store
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD}@postgres:5432/store_db
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - caddy_net

  webapp:
    image: ghcr.io/${GHCR_OWNER}/esof2-webapp:${IMAGE_TAG:-latest}
    container_name: esof2_web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_AUTH_API_BASE: ${AUTH_API_BASE:-https://auth.olimposhowcase.com.br}
      PORT: 3000
    networks:
      - caddy_net

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  caddy_net:
    external: true
