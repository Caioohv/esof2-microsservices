services:
  mysql:
    image: mysql:8
    container_name: esof2_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/auth-service/init.sql:/docker-entrypoint-initdb.d/01-auth.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: esof2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: store_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/esof2-auth-service:${IMAGE_TAG:-latest}
    container_name: esof2_auth
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - caddy_net

  store-service:
    image: ghcr.io/${GHCR_OWNER}/esof2-store-service:${IMAGE_TAG:-latest}
    container_name: esof2_store
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_ROOT_PASSWORD}@postgres:5432/store_db
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - caddy_net

volumes:
  mysql_data:
  postgres_data:

networks:
  internal:
    driver: bridge
  caddy_net:
    external: true
