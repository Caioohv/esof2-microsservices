services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/auth-service/init.sql:/docker-entrypoint-initdb.d/01-auth.sql
      - ./services/payment-service/init.sql:/docker-entrypoint-initdb.d/02-payment.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    ports:
      - "3003:3003"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      DB_NAME: payment_db
      AUTH_SERVICE_URL: http://auth-service:3001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BASE_URL: ${PAYMENT_BASE_URL:-http://localhost:3003}
      PORT: 3003
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started

volumes:
  mysql_data:
